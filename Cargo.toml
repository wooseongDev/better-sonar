[package]
name = "better-sonar"
version = "0.0.9"
edition = "2024"
license = "MIT"

[lints]
workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
auto-launch = "=0.5.0"
base64 = "0.22"
futures-util = "0.3"
global-hotkey = "=0.8.0"
gpui = { version = "=0.2.2", default-features = false }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
minisign-verify = "0.2"
native-tls = "0.2"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
tray-icon = "=0.24.1"
urlencoding = "2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
axum = "0.8"
minisign = "0.9"

[build-dependencies]
winresource = "0.1"

[workspace]
members = ["scripts/windows/sign"]
resolver = "2"

[workspace.lints.clippy]
all = "warn"
