name: Release Windows installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and draft release
    runs-on: windows-latest
    environment: release

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RELEASE_TAG -notmatch '^v(.+)$') {
            throw "Release tag must start with 'v'; received '$env:RELEASE_TAG'."
          }

          $tagVersion = $Matches[1]
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoToml = Get-Content src-tauri/Cargo.toml -Raw
          $cargoMatch = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) {
            throw 'Could not read the package version from src-tauri/Cargo.toml.'
          }
          $cargoVersion = $cargoMatch.Groups[1].Value

          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion -or $tagVersion -ne $cargoVersion) {
            throw "Version mismatch: tag='$tagVersion', package.json='$packageVersion', tauri.conf.json='$tauriVersion', Cargo.toml='$cargoVersion'."
          }

          Write-Host "Release versions match: $tagVersion"

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows Authenticode signing can be added here later. It is separate
      # from the mandatory Tauri updater signature configured below.
      - name: Build installers and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Better Sonar ${{ github.ref_name }}
          releaseBody: |
            Windows installers for Better Sonar ${{ github.ref_name }}.

            This draft was generated by GitHub Actions. Review the assets before publishing.
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi -- --locked

      - name: Verify updater manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          New-Item -ItemType Directory -Force artifacts | Out-Null
          gh release download $env:RELEASE_TAG --pattern latest.json --dir artifacts --clobber

          $manifest = Get-Content artifacts/latest.json -Raw | ConvertFrom-Json
          $expectedVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($manifest.version -ne $expectedVersion) {
            throw "Updater manifest version mismatch: expected='$expectedVersion', actual='$($manifest.version)'."
          }

          $nsis = @(Get-ChildItem target/release/bundle/nsis/*.exe -File)
          $nsisSignature = @(Get-ChildItem target/release/bundle/nsis/*.sig -File)
          if ($nsis.Count -ne 1 -or $nsisSignature.Count -ne 1) {
            throw "Expected one NSIS installer and signature; found installer=$($nsis.Count), signature=$($nsisSignature.Count)."
          }

          $expectedSignature = (Get-Content $nsisSignature[0].FullName -Raw).Trim()
          foreach ($target in @('windows-x86_64-nsis', 'windows-x86_64')) {
            $entry = $manifest.platforms.$target
            if ($null -eq $entry) {
              throw "Updater manifest is missing platform '$target'."
            }
            if ($entry.url -notmatch '-setup\.exe$') {
              throw "Updater platform '$target' does not point to an NSIS installer: '$($entry.url)'."
            }
            if ([string]::IsNullOrWhiteSpace($entry.signature) -or $entry.signature.Trim() -ne $expectedSignature) {
              throw "Updater platform '$target' does not contain the generated NSIS signature."
            }
          }

          Write-Host "Updater manifest verified for Better Sonar $expectedVersion."

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nsis = @(Get-ChildItem target/release/bundle/nsis/*.exe -File)
          $msi = @(Get-ChildItem target/release/bundle/msi/*.msi -File)
          $signatures = @(
            Get-ChildItem target/release/bundle/nsis/*.sig -File
            Get-ChildItem target/release/bundle/msi/*.sig -File
          )

          if ($nsis.Count -ne 1 -or $msi.Count -ne 1 -or $signatures.Count -ne 2) {
            throw "Expected one NSIS installer, one MSI installer, and two updater signatures; found NSIS=$($nsis.Count), MSI=$($msi.Count), signatures=$($signatures.Count)."
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          $lines = @($nsis[0], $msi[0]) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            $uploadedName = $_.Name.Replace(' ', '.')
            "$hash  $uploadedName"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'artifacts/SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload checksums to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME artifacts/SHA256SUMS.txt --clobber
