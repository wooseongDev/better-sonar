name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: windows-2025 # Includes WiX 3
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build Windows installers
        run: ./scripts/bundle-windows.ps1
      - name: Verify installation and upgrade
        run: ./packaging/windows/test-upgrade.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: target/release/bundle/
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installers
          path: target/release/bundle
      - name: Sign installers and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BETTER_SONAR_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BETTER_SONAR_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./packaging/windows/publish.ps1 -Tag $env:GITHUB_REF_NAME
