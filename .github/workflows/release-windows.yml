name: Windows build and release

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check whether to build installers
        id: packaging
        shell: pwsh
        run: |
          $needed = $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -or $env:GITHUB_REF_TYPE -eq 'tag'
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $paths = @(
              'packaging/windows/'
              'build.rs'
              'assets/'
              'Cargo.toml'
              'Cargo.lock'
              'rust-toolchain.toml'
              '.cargo/'
              '.github/workflows/release-windows.yml'
            )
            # The first parent of the checked-out PR merge commit is the base.
            $changedPaths = @(git diff --name-only --no-renames HEAD^1 HEAD -- $paths)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $needed = $changedPaths.Count -gt 0
          }
          "needed=$($needed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check Rust
        shell: pwsh
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --workspace
      - name: Install packaging tools
        if: steps.packaging.outputs.needed == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "$env:WIX\bin\candle.exe") -and
              -not (Test-Path "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin\candle.exe")) {
            choco install wixtoolset --version 3.14.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build Windows installers
        if: steps.packaging.outputs.needed == 'true'
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Verify installation and upgrade
        if: steps.packaging.outputs.needed == 'true'
        shell: pwsh
        run: ./packaging/windows/test-upgrade.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.packaging.outputs.needed == 'true'
        with:
          name: windows-installers
          path: target/release/bundle/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installers
          path: target/release/bundle
      - name: Sign installers and create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BETTER_SONAR_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BETTER_SONAR_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./packaging/windows/publish.ps1 -Tag $env:GITHUB_REF_NAME
