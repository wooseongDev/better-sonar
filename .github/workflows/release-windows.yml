name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  package:
    needs: checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build Windows installers
        run: ./scripts/bundle-windows.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Verify installation and upgrade
        run: ./scripts/test-windows-upgrade.ps1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installers
          path: |
            target/release/bundle/Better.Sonar_*_x64-setup.exe
            target/release/bundle/Better.Sonar_*_x64_ko-KR.msi
          if-no-files-found: error

  release:
    needs: package
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-installers
          path: target/release/bundle

      - name: Sign installers and create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BETTER_SONAR_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          BETTER_SONAR_SIGNING_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./scripts/publish-windows.ps1 -Tag $env:GITHUB_REF_NAME
