name: Release Windows installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and draft release
    runs-on: windows-latest

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ($env:RELEASE_TAG -notmatch '^v(.+)$') {
            throw "Release tag must start with 'v'; received '$env:RELEASE_TAG'."
          }

          $tagVersion = $Matches[1]
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version

          if ($tagVersion -ne $packageVersion -or $tagVersion -ne $tauriVersion) {
            throw "Version mismatch: tag='$tagVersion', package.json='$packageVersion', tauri.conf.json='$tauriVersion'."
          }

          Write-Host "Release versions match: $tagVersion"

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Windows signing can be added here later by configuring Tauri's signing
      # environment variables from GitHub Actions secrets.
      - name: Build installers and create draft release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Better Sonar ${{ github.ref_name }}
          releaseBody: |
            Windows installers for Better Sonar ${{ github.ref_name }}.

            This draft was generated by GitHub Actions. Review the assets before publishing.
          releaseDraft: true
          prerelease: false
          tauriScript: pnpm tauri
          args: --bundles nsis,msi -- --locked

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe -File)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi -File)

          if ($nsis.Count -ne 1 -or $msi.Count -ne 1) {
            throw "Expected exactly one NSIS installer and one MSI installer; found NSIS=$($nsis.Count), MSI=$($msi.Count)."
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          $lines = @($nsis[0], $msi[0]) | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [IO.File]::WriteAllLines(
            (Join-Path $PWD 'artifacts/SHA256SUMS.txt'),
            $lines,
            [Text.UTF8Encoding]::new($false)
          )
          Get-Content artifacts/SHA256SUMS.txt

      - name: Upload checksums to the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:GITHUB_REF_NAME artifacts/SHA256SUMS.txt --clobber
