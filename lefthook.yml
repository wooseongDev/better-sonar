pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'rustfmt.toml'
      run: cargo fmt --all --check
    clippy:
      glob:
        - '*.rs'
        - '**/*.rs'
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'rustfmt.toml'
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings
